name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update Pages site (main /)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          body='{"source":{"branch":"main","path":"/"}}'
          code=$(curl -sS -o /tmp/pages-post.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$body" \
            "$api")
          echo "POST status: ${code}"
          cat /tmp/pages-post.json
          echo
          if [ "$code" = "409" ] || [ "$code" = "422" ]; then
            code=$(curl -sS -o /tmp/pages-patch.json -w "%{http_code}" \
              -X PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d "$body" \
              "$api")
            echo "PATCH status: ${code}"
            cat /tmp/pages-patch.json
            echo
          fi
          curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" | tee /tmp/pages-get.json
          echo
